name: Sincronizar estoque obaobamix -> Wilboor

on:
  schedule:
    # 08h, 12h, 16h e 20h no horário de Brasília (UTC-3) = 11h, 15h, 19h e 23h UTC
    - cron: '0 11,15,19,23 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Somente simular (não clica em Pausar/Publicar)'
        type: boolean
        default: false

concurrency:
  group: sincronizar-estoque
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Executar sincronização
        run: npm start
        env:
          OBA_SESSION: ${{ secrets.OBA_SESSION }}
          OBA_USER: ${{ secrets.OBA_USER }}
          OBA_PASSWORD: ${{ secrets.OBA_PASSWORD }}
          WILBOOR_USER: ${{ secrets.WILBOOR_USER }}
          WILBOOR_PASSWORD: ${{ secrets.WILBOOR_PASSWORD }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      - name: Salvar relatório e capturas de tela
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-${{ github.run_number }}
          path: artifacts/
          retention-days: 14
