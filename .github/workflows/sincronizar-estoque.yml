name: Sincronizar estoque obaobamix -> Wilboor

# Sem agendamento: o Cloudflare do obaobamix bloqueia navegadores automatizados.
# A automação roda pela extensão do Edge (pasta extensao-edge/). Este workflow
# fica só para execução manual da versão Playwright.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Somente simular (não clica em Pausar/Publicar)'
        type: boolean
        default: false

concurrency:
  group: sincronizar-estoque
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Executar sincronização
        run: npm start
        env:
          OBA_SESSION: ${{ secrets.OBA_SESSION }}
          OBA_USER: ${{ secrets.OBA_USER }}
          OBA_PASSWORD: ${{ secrets.OBA_PASSWORD }}
          WILBOOR_PASSWORD: ${{ secrets.WILBOOR_PASSWORD }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      - name: Salvar relatório e capturas de tela
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-${{ github.run_number }}
          path: artifacts/
          retention-days: 14
